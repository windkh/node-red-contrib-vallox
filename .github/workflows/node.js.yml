# Run lint, format check, unit tests and the coverage gate on every push and PR to main.
# `build` tests the supported floor (see `node-red.version` in package.json); `forward-compat`
# additionally tries the newest Node-RED release and is advisory only.
# See https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

# Least privilege for GITHUB_TOKEN. Without an explicit block a workflow inherits the
# repository default, which on many repos is read *and write* to everything -- flagged by
# CodeQL as actions/missing-workflow-permissions. Both jobs only read the checkout; the
# artifact upload authenticates with the runtime token, not GITHUB_TOKEN.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # Keep the lowest entry in step with the `engines.node` floor in package.json.
                node-version: [20.x, 22.x, 24.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run coverage:check
            # Uploaded from one matrix leg only — the report is identical across them, and
            # two legs writing the same artifact name is an error. Makes a coverage
            # regression inspectable from the failing run instead of only reproducible locally.
            - name: Upload coverage report
              if: matrix.node-version == '22.x'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report
                  # Only the readable report. `coverage/` also holds c8's raw V8 dump in
                  # tmp/, which is ~97% of the bytes and inspectable by nothing — 6.6 MB of
                  # tmp against a 303 kB report here.
                  path: |
                      coverage/lcov-report
                      coverage/lcov.info
                  retention-days: 14

    forward-compat:
        # Early warning that a new Node-RED release breaks the nodes. Advisory: the devDependency
        # deliberately stays on the declared floor, so this job must not gate a merge.
        name: Latest Node-RED (advisory)
        runs-on: ubuntu-latest
        continue-on-error: true

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci
            - name: Install the newest Node-RED over the pinned floor
              run: npm install --no-save node-red@latest
            - name: Report the version under test
              run: node -p "'node-red ' + require('node-red/package.json').version"
            - run: npm test
