# Synced into target repos by `nrstd sync` as .github/workflows/standards-check.yml.
# Fails CI if the repo drifts from the shared standard. Tool-neutral (no AI).
# `nrstd audit` exits non-zero below full marks, so a repo adopting this should run
# `nrstd sync --write` first — otherwise its next push goes red on pre-existing drift.
name: Standards check
on:
    push:
        branches: [master, main]
    pull_request:
permissions:
    contents: read
jobs:
    standards:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'npm'
            # Audit with the copy the lockfile pins, not a fresh fetch of the standard's
            # default branch. `npx --yes github:windkh/node-red-standards audit` re-resolved
            # HEAD on every run, so a rule added upstream turned this job red on a commit
            # that had changed nothing — drift in the standard reading as drift in the repo.
            # Pinning it to the devDependency makes the result reproducible and moves
            # standard bumps into dependabot PRs, where they can be reviewed on their own.
            - run: npm ci
            - run: npm run standards:audit
