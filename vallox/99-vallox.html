<script type="text/x-red" data-help-name="valloxrx">
    <p>Decodes Vallox RS485 telegrams (6-byte frames) from a raw byte stream &mdash; typically the output of a <code>serial in</code> node or an MQTT bridge.</p>
    <p>Incoming bytes are buffered until a complete frame is available. Misaligned leading bytes are dropped at the next start byte (<code>0x01</code>). Because <code>0x01</code> is also a legal value elsewhere in a frame, a window that fails its checksum costs only its first byte before the node rescans.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt class="optional">Description <span class="property-type">string</span></dt>
        <dd>Optional label shown on the node in the editor.</dd>
        <dt class="optional">Diagnostics <span class="property-type">boolean</span></dt>
        <dd>Logs every received chunk and every framing decision as hex, and replaces the node status with running counters: bytes received, frames decoded out of the number the byte count implies, bytes dropped and checksum failures. Use it to tell a lossy transport from a mis-wired one &mdash; a healthy stream is one frame per six bytes with no drops.</dd>
        <dt class="optional">Capture file <span class="property-type">string</span></dt>
        <dd>If set, every received byte is appended to this file exactly as it arrived. Nothing is written unless a path is given. Useful for offline analysis: a capture that is not a clean concatenation of 6-byte frames shows whether bytes are being lost or corrupted upstream.</dd>
    </dl>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">Buffer | number[]</span></dt>
        <dd>Raw bytes from the RS485 bus.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Decoded telegram
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>Decoded frame with <code>domain</code>, <code>sender</code>, <code>receiver</code>, <code>command</code>, <code>arg</code>, <code>checksum</code>, <code>variable</code> (human name, e.g. <code>FanSpeed</code>), <code>request</code> (<code>"GET"</code> or <code>"SET"</code>) and &mdash; for <code>SET</code> frames &mdash; <code>value</code> (already converted, e.g. fan speed level 1-8 or temperature in &deg;C).</dd>
            </dl>
        </li>
        <li>Decoding error
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Error message (bad checksum, wrong length, etc.).</dd>
            </dl>
        </li>
    </ol>
</script>

<script type="text/x-red" data-help-name="valloxtx">
    <p>Encodes a Vallox RS485 telegram into a 6-byte frame, ready to send to the RS485 bus via a <code>serial out</code> node or an MQTT bridge. Normally fed by the second output of the <strong>vallox</strong> node.</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt class="optional">Description <span class="property-type">string</span></dt>
        <dd>Optional label shown on the node in the editor.</dd>
        <dt class="optional">Output <span class="property-type">array | buffer</span></dt>
        <dd>Whether output 1 carries an <b>array of byte values</b> (the default, and what this node has always emitted) or a <b>Buffer</b>. A <code>serial out</code> node writes either as bytes, but anything that serialises the payload &mdash; <code>mqtt out</code> above all &mdash; encodes an array as the text <code>[1,33,17,&hellip;]</code>, and the receiving end then writes those characters to the port rather than the telegram. Pick Buffer when the frame leaves Node-RED as a message payload.</dd>
    </dl>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Frame to encode: <code>{ domain, sender, receiver, command, arg }</code>. The checksum byte is appended automatically.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Encoded telegram
            <dl class="message-properties">
                <dt>payload <span class="property-type">number[]</span></dt>
                <dd>6-byte array <code>[domain, sender, receiver, command, arg, checksum]</code>.</dd>
            </dl>
        </li>
        <li>Encoding error
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Error message (e.g. empty input).</dd>
            </dl>
        </li>
    </ol>
</script>

<script type="text/x-red" data-help-name="vallox">
    <p>Maintains the in-memory state of a Vallox device and produces request telegrams. The node listens for decoded frames addressed to its configured receiver (or that receiver's group) and stores each <code>SET</code> value under its human-readable variable name (e.g. <code>FanSpeed</code>, <code>TemperatureOutside</code>).</p>

    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Description <span class="property-type">string</span></dt>
        <dd>Label shown on the node.</dd>
        <dt>Receiver <span class="property-type">number</span></dt>
        <dd>RS485 address of the panel or master this node represents (Panel 1 = 33 / 0x21 &hellip; Panel 7 = 39 / 0x27, LON = 40 / 0x28, Master 1 = 17 / 0x11). This address is also used as the <em>sender</em> of outgoing telegrams, so it must not be one your own hardware uses. <strong>The original Vallox control unit is Panel 1 (33), and further panels take 34, 35 &hellip; in order</strong> &mdash; so the top of this list is usually the wrong choice. Pick a free address such as Panel 7, and add as few transmitters to the bus as you can: nothing arbitrates access, so every extra sender makes collisions likelier. See "Bus addressing" in the README.</dd>
        <dt>Send msg on new data <span class="property-type">boolean</span></dt>
        <dd>If checked, output 1 fires every time a matching <code>SET</code> frame updates the state; otherwise output 1 only fires on an explicit query.</dd>
        <dt>Write like a panel <span class="property-type">boolean</span></dt>
        <dd>A <code>SET</code> produces the same three telegrams a real control unit sends: to the mainboard with the checksum repeated, then to all panels, then to all mainboards. Unticking sends only the first, which the master normally propagates on its own.</dd>
    </dl>

    <h3>Inputs</h3>
    <p>The node accepts three input shapes on <code>msg.payload</code>:</p>
    <dl class="message-properties">
        <dt>Decoded frame <span class="property-type">object</span></dt>
        <dd>Output of the <strong>valloxrx</strong> node (an object with a <code>receiver</code> field). Matching frames update the internal state.</dd>
        <dt>Request <span class="property-type">object</span></dt>
        <dd><code>{ request: "GET" | "SET", variable: "&lt;name&gt;", value: &lt;value&gt; }</code> &mdash; produces an encoded request on output 2. A <code>GET</code> needs no <code>value</code>; the unit's reply arrives as ordinary bus traffic and lands in the state. Only seven registers are broadcast without being asked for, so most variables have to be polled with a <code>GET</code>. Bit fields such as <code>Select</code> accept the decoded object back, so read-modify-write works.</dd>
        <dt class="optional">Anything else / empty <span class="property-type">any</span></dt>
        <dd>Emits the current state snapshot on output 1.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Current state
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>All variables seen so far, keyed by name (e.g. <code>FanSpeed</code>, <code>TemperatureOutside</code>, &hellip;) plus <code>Receiver</code>.</dd>
            </dl>
        </li>
        <li>Outgoing telegram
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>Telegram ready to feed into the <strong>valloxtx</strong> node.</dd>
            </dl>
        </li>
        <li>Error
            <dl class="message-properties">
                <dt>payload <span class="property-type">string</span></dt>
                <dd>Error message: a <code>SET</code> on a readonly variable, an unknown variable name, a value that does not encode to a single byte, or a request made while the unit has prohibited bus transmission (<code>91H</code>).</dd>
            </dl>
        </li>
    </ol>
</script>
